<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form method="POST" action="{{ url_for('login') }}" class="modal-content p-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="loginModalLabel">Вход в систему</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="modalUsername" name="username" placeholder="Имя пользователя" required>
          <label for="modalUsername">Имя пользователя</label>
        </div>

        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="modalPassword" name="password" placeholder="Пароль" required>
          <label for="modalPassword">Пароль</label>
        </div>

        <div class="form-check text-start my-3">
          <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
          <label class="form-check-label" for="flexCheckDefault">Запомнить меня</label>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="submit" class="btn btn-primary w-100 py-2">Войти</button>
      </div>
    </form>
  </div>
</div>
